[tool.poetry]
name = "api-livros-redis-celery"
version = "0.1.2"
description = "API de livros com Redis e Celery"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
redis = "^5.0.1"
celery = "^5.3.4"
httpx = "^0.25.0"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"