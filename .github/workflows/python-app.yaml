name: Python application with Docker build

on:
  push:
    branches: [ "main", develop ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout do código
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Instalar Poetry (para testes)
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    # 3. Configurar Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'poetry'
    
    # 4. Instalar dependências com Poetry
    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-root
    
    # 5. Executar testes
    - name: Run tests
      run: |
        poetry run pytest tests/ -v
    
    # 6. Construir imagem Docker (usando seu Dockerfile)
    - name: Build Docker image
      run: |
        docker build -t fastapi-app:latest .
    
    # 7. Executar container para verificar se funciona
    - name: Run Docker container
      run: |
        docker run -d --name fastapi-test -p 8000:8000 fastapi-app:latest
        sleep 5  # Aguarda a aplicação iniciar
    
    # 8. Testar se o container está respondendo
    - name: Test container health
      run: |
        curl --fail http://localhost:8000/health || exit 1
    
    # 9. Limpeza (opcional, mas boa prática)
    - name: Clean up
      if: always()
      run: |
        docker stop fastapi-test || true
        docker rm fastapi-test || true