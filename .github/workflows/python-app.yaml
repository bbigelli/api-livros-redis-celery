name: Python application with Docker build

on:
  push:
    branches: [ "main", develop ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    # Adicione serviços para testes
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    # 1. Checkout do código
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Configurar Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # 3. Instalar dependências do requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 4. Executar testes
    - name: Run tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml
    
    # 5. Construir imagem Docker
    - name: Build Docker image
      run: |
        docker build -t fastapi-app:latest .
    
    # 6. Executar container
    - name: Run Docker container
      run: |
        docker run -d --name fastapi-test -p 8000:8000 fastapi-app:latest
        sleep 5
    
    # 7. Testar se o container está respondendo
    - name: Test container health
      run: |
        curl --fail http://localhost:8000/ || exit 1
        curl --fail http://localhost:8000/docs || exit 1
    
    # 8. Limpeza
    - name: Clean up
      if: always()
      run: |
        docker stop fastapi-test || true
        docker rm fastapi-test || true