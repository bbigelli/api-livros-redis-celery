name: Python application with Docker build

on:
  push:
    branches: [ "main", develop ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout do código (versão v3 conforme solicitado)
    - name: Checkout repository
      uses: actions/checkout@v3
    
    # 2. Instalar Poetry
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    # 3. Configurar Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    # 4. Gerar/Atualizar o poetry.lock (se necessário)
    - name: Update poetry.lock
      run: |
        poetry lock --no-update || poetry lock
    
    # 5. Instalar dependências com Poetry
    - name: Install dependencies with Poetry
      run: |
        poetry install --no-interaction --no-root
    
    # 6. Executar testes com Poetry
    - name: Run tests with Poetry
      run: |
        poetry run pytest testes/ -v --cov=. --cov-report=xml
    
    # 7. Construir imagem Docker
    - name: Build Docker image
      run: |
        docker build -t fastapi-app:latest .
    
    # 8. Executar container
    - name: Run Docker container
      run: |
        docker run -d --name fastapi-test -p 8000:8000 fastapi-app:latest
        sleep 5
    
    # 9. Testar se o container está respondendo
    - name: Test container health
      run: |
        curl --fail http://localhost:8000/ || exit 1
        curl --fail http://localhost:8000/docs || exit 1
    
    # 10. Limpeza
    - name: Clean up
      if: always()
      run: |
        docker stop fastapi-test || true
        docker rm fastapi-test || true