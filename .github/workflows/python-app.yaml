name: CI/CD Pipeline for FastAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout do código
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Instalar Python 3.9
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    # 3. Instalar Poetry via pip (SOLUÇÃO MAIS ESTÁVEL)
    - name: Install Poetry
      run: |
        pip install poetry==1.7.1

    # 4. Configurar cache do Poetry
    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    # 5. Configurar Poetry para não criar virtualenv (opcional, melhora performance)
    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create false

    # 6. Instalar dependências
    - name: Install dependencies
      run: |
        poetry install --no-root --no-interaction

    # 7. Rodar testes
    - name: Run tests
      run: |
        poetry run pytest --maxfail=1 --disable-warnings -v

    # 8. Build da aplicação
    - name: Build application
      run: |
        poetry build